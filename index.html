<style>
  :root{color-scheme: light dark;}
  html,body{margin:0; padding:0;}
  body{padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
  img{max-width:100%;}
  [hidden]{display:none !important;}
  :root{
    --bg:#F5F3ED;
    --surface:#FFFFFF;
    --surface-2:#ECE7DB;
    --ink:#1D2420;
    --muted:#6E6A60;
    --accent:#2E6E4E;
    --accent-ink:#F5FBF6;
    --accent-2:#C1531F;
    --line:#E2DCCC;
    --live:#C1531F;
    --win:#2E6E4E;
    --loss:#B4423A;
    --shadow: 0 1px 2px rgba(29,36,32,.06), 0 4px 14px rgba(29,36,32,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121613;
      --surface:#1B211D;
      --surface-2:#232B25;
      --ink:#EDEFE9;
      --muted:#9BA096;
      --accent:#59A97B;
      --accent-ink:#0A140E;
      --accent-2:#E38350;
      --line:#2C342E;
      --live:#E38350;
      --win:#59A97B;
      --loss:#E07C74;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 18px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#121613;
    --surface:#1B211D;
    --surface-2:#232B25;
    --ink:#EDEFE9;
    --muted:#9BA096;
    --accent:#59A97B;
    --accent-ink:#0A140E;
    --accent-2:#E38350;
    --line:#2C342E;
    --live:#E38350;
    --win:#59A97B;
    --loss:#E07C74;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 18px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
    padding-inline:16px;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:640px;margin:0 auto;}
  h1,h2,h3,.display{
    font-family:"Barlow Condensed", system-ui, sans-serif;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.02em;
    text-wrap:balance;
    margin:0;
  }
  .tabular{font-variant-numeric:tabular-nums;}
  button{font-family:inherit;}
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }

  /* ---- header ---- */
  header.topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
    background:var(--bg);
    padding-block:14px 10px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:9px;}
  .brand .headtext{display:flex; flex-direction:column; line-height:1;}
  .brand .name{font-size:22px;}
  .brand .sub{font-family:"Source Sans 3"; font-size:11.5px; color:var(--muted); text-transform:none; letter-spacing:0; font-weight:600; margin-top:2px;}
  .pawbadge{
    width:34px; height:34px; border-radius:50%; object-fit:cover; object-position:50% 30%;
    background:var(--surface-2); border:1.5px solid var(--line); flex-shrink:0;
  }
  .mascot{
    width:132px; height:auto; max-height:132px; object-fit:contain; margin-bottom:-6px;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.18));
  }
  .headerbtns{display:flex; align-items:center; gap:8px;}
  .iconbtn{
    width:36px; height:36px; border-radius:10px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .whoami{
    display:flex; align-items:center; gap:6px; padding:6px 10px; border-radius:999px;
    background:var(--surface-2); font-weight:600; font-size:13px; cursor:pointer; border:1px solid transparent;
  }
  .whoami .dot{width:8px;height:8px;border-radius:50%; background:var(--accent);}
  .pawbtn{overflow:hidden; padding:5px;}
  .pawbtn img.pawspin{width:100%; height:100%; object-fit:cover; border-radius:6px;}
  .pawbtn:disabled{opacity:.6; cursor:default;}
  @media (prefers-reduced-motion: no-preference){
    .pawspin.spinning{animation:pawspin 0.9s linear infinite;}
  }
  @keyframes pawspin{ to{ transform:rotate(360deg); } }
  .syncstrip{
    text-align:center; font-size:11px; color:var(--muted); font-weight:600; padding-bottom:6px;
  }
  .syncstrip .synerr{color:var(--accent-2);}

  /* ---- week nav ---- */
  .weeknav{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding-block:10px;
  }
  .weeknav button{
    width:34px; height:34px; border-radius:9px; border:1px solid var(--line); background:var(--surface);
    color:var(--ink); font-size:16px; cursor:pointer;
  }
  .weeknav button:disabled{opacity:.35; cursor:default;}
  .weeklabel{font-family:"Barlow Condensed"; font-weight:700; font-size:19px; text-transform:uppercase; letter-spacing:.02em;}
  .weeklabel .yr{color:var(--muted); font-size:13px; font-family:"Source Sans 3"; text-transform:none; font-weight:600; letter-spacing:0; margin-left:6px;}

  /* ---- tabs ---- */
  .segctl{display:flex; gap:4px; background:var(--surface-2); padding:4px; border-radius:12px; margin-block:4px 14px;}
  .segctl button{
    flex:1; border:none; background:transparent; color:var(--muted); font-weight:700; font-size:13.5px;
    padding:9px 6px; border-radius:9px; cursor:pointer; letter-spacing:.01em;
  }
  .segctl button.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow);}

  /* ---- week summary strip ---- */
  .weeksum{display:flex; gap:10px; margin-bottom:16px;}
  .sumcard{
    flex:1; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:10px 12px;
    box-shadow:var(--shadow);
  }
  .sumcard .lbl{font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.05em;}
  .sumcard .val{font-family:"Barlow Condensed"; font-weight:800; font-size:26px; margin-top:2px;}
  .sumcard .val small{font-family:"Source Sans 3"; font-weight:600; font-size:14px; color:var(--muted);}

  /* ---- day group ---- */
  .daylabel{
    font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);
    margin:18px 2px 8px;
  }
  .daylabel:first-of-type{margin-top:0;}

  /* ---- game card ---- */
  .game{
    background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:12px;
    box-shadow:var(--shadow); margin-bottom:10px;
  }
  .gametop{display:flex; align-items:center; gap:8px; margin-bottom:9px;}
  .status{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--muted);}
  .status.live{color:var(--live);}
  .status.final{color:var(--ink);}
  .gtitle{font-size:11px; color:var(--muted); font-weight:600; flex:1; text-align:right;}
  .editscore{
    background:none; border:none; color:var(--muted); font-size:14px; cursor:pointer; padding:2px 4px;
    border-radius:6px; line-height:1; flex-shrink:0;
  }
  .editscore:hover{color:var(--ink); background:var(--surface-2);}
  .teams{display:flex; align-items:stretch; gap:8px;}
  .teambtn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:12px 6px; border-radius:12px; border:1.5px solid var(--line); background:var(--bg);
    cursor:pointer; position:relative; color:var(--ink);
  }
  .teambtn .ab{font-family:"Barlow Condensed"; font-weight:800; font-size:20px; letter-spacing:.02em;}
  .teambtn .nm{font-size:10.5px; color:var(--muted); font-weight:600; text-align:center;}
  .teambtn .sc{font-family:"Barlow Condensed"; font-weight:800; font-size:22px; margin-top:2px;}
  .teambtn.mine{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, var(--surface));}
  .teambtn.mine .ab{color:var(--accent);}
  .teambtn.theirs-ghost::after{
    content:"picked"; position:absolute; top:6px; right:8px; font-size:9px; font-weight:700;
    color:var(--muted); text-transform:uppercase; letter-spacing:.04em;
  }
  .teambtn.winner{background:color-mix(in srgb, var(--win) 16%, var(--surface)); border-color:var(--win);}
  .teambtn.loser{opacity:.55;}
  .teambtn:disabled{cursor:default;}
  .vs{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; width:38px; flex-shrink:0;}
  .vs .at{color:var(--muted); font-size:12px; font-weight:700;}
  .vs .clk{font-size:10px; color:var(--live); font-weight:700; text-align:center;}
  .picksrow{display:flex; gap:14px; margin-top:9px; padding-top:9px; border-top:1px dashed var(--line);}
  .pickpill{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); font-weight:600;}
  .pickpill b{color:var(--ink); font-weight:700;}
  .pickpill .correct{color:var(--win);}
  .pickpill .wrong{color:var(--loss); text-decoration:line-through; text-decoration-color:var(--loss);}

  /* ---- standings ---- */
  .lbrow{display:flex; gap:10px; margin-bottom:14px;}
  .plcard{
    flex:1; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px;
    box-shadow:var(--shadow); text-align:center;
  }
  .plcard.leader{border-color:var(--accent);}
  .plcard .pname{font-family:"Barlow Condensed"; font-weight:800; font-size:18px; text-transform:uppercase;}
  .plcard .big{font-family:"Barlow Condensed"; font-weight:800; font-size:38px; margin-top:2px;}
  .plcard .rec{font-size:12px; color:var(--muted); font-weight:600; margin-top:2px;}
  .plcard .crown{font-size:11px; color:var(--accent); font-weight:700; text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px;}

  table.weeks{width:100%; border-collapse:collapse; font-size:13.5px;}
  table.weeks th, table.weeks td{padding:8px 6px; text-align:center; border-bottom:1px solid var(--line);}
  table.weeks th{color:var(--muted); font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.04em;}
  table.weeks td:first-child, table.weeks th:first-child{text-align:left; font-weight:700;}
  .tablewrap{overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:6px 10px; box-shadow:var(--shadow);}
  .win-tag{color:var(--win); font-weight:700;}

  .empty{color:var(--muted); text-align:center; padding:30px 10px; font-size:14px; display:flex; flex-direction:column; align-items:center; gap:10px;}
  .emptydog{width:84px; height:auto; opacity:.85; filter:grayscale(.15);}
  .crown{display:flex; align-items:center; justify-content:center; gap:5px; font-size:11px; color:var(--accent); font-weight:700; text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px;}
  .crowndog{width:18px; height:18px; border-radius:50%; object-fit:cover; object-position:50% 25%;}

  /* ---- login ---- */
  .loginscreen{
    min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px; text-align:center;
  }
  .loginscreen .display{font-size:34px;}
  .loginscreen .tag{color:var(--muted); font-size:13.5px; margin-top:-14px;}
  .players{display:flex; gap:14px; width:100%; max-width:360px;}
  .playerbtn{
    flex:1; padding:22px 8px; border-radius:18px; border:1.5px solid var(--line); background:var(--surface);
    display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; box-shadow:var(--shadow);
  }
  .avatar{width:46px; height:46px; border-radius:50%; background:var(--accent); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center; font-family:"Barlow Condensed"; font-weight:800; font-size:20px;}
  .playerbtn:nth-child(2) .avatar{background:var(--accent-2);}
  .playerbtn .pn{font-weight:700; font-size:15px;}
  .pinpad{display:flex; flex-direction:column; align-items:center; gap:18px;}
  .pindots{display:flex; gap:12px;}
  .pindot{width:14px; height:14px; border-radius:50%; border:1.5px solid var(--muted); }
  .pindot.filled{background:var(--accent); border-color:var(--accent);}
  .pindot.err{background:var(--loss); border-color:var(--loss);}
  .padgrid{display:grid; grid-template-columns:repeat(3,64px); gap:12px;}
  .padgrid button{
    width:64px; height:64px; border-radius:50%; border:1px solid var(--line); background:var(--surface);
    font-family:"Barlow Condensed"; font-weight:700; font-size:22px; color:var(--ink); cursor:pointer;
  }
  .padgrid button.wide{font-family:"Source Sans 3"; font-size:13px; font-weight:700; color:var(--muted); border-color:transparent; background:transparent;}
  .backlink{color:var(--muted); font-size:13px; font-weight:600; text-decoration:underline; cursor:pointer; background:none; border:none;}

  /* ---- settings modal ---- */
  .overlay{position:fixed; inset:0; background:rgba(15,18,15,.5); display:flex; align-items:flex-end; justify-content:center; z-index:50;}
  @media (min-width:520px){.overlay{align-items:center;}}
  .sheet{
    background:var(--surface); width:100%; max-width:420px; border-radius:20px 20px 0 0; padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));
    box-shadow:var(--shadow); max-height:85vh; overflow-y:auto;
  }
  @media (min-width:520px){.sheet{border-radius:20px;}}
  .sheet h3{font-size:20px; margin-bottom:14px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:5px;}
  .field input{
    width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink);
    font-size:15px; font-family:inherit;
  }
  .sheetbtns{display:flex; gap:10px; margin-top:6px;}
  .btn{flex:1; padding:12px; border-radius:11px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-weight:700; cursor:pointer; font-size:14px;}
  .btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .closex{position:absolute; top:14px; right:16px; background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer;}
  footer.note{text-align:center; color:var(--muted); font-size:11.5px; padding-block:20px calc(18px + env(safe-area-inset-bottom,0px));}
</style>

  var state = {

    configLoaded: false,

  try { state.player = localStorage.getItem('pickem_player') || null; } catch(e){}

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function fmtDay(iso){
    var d = new Date(iso);
    return d.toLocaleDateString(undefined, {weekday:'long', month:'short', day:'numeric'});
  }
  function fmtTime(iso){
    var d = new Date(iso);
    return d.toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'});
  }
  function timeAgo(iso){
    if (!iso) return 'never yet';
    var s = Math.round((Date.now() - new Date(iso).getTime())/1000);
    if (s < 15) return 'just now';
    if (s < 60) return s+'s ago';
    var m = Math.round(s/60);
    if (m < 60) return m+'m ago';
    var h = Math.round(m/60);
    return h+'h ago';
  }
  function isLocked(g){
    if (g.state && g.state !== 'scheduled') return true;
    return Date.now() >= new Date(g.kickoff).getTime();
  }

  function gamesForWeek(wk){
    return state.games.filter(function(g){ return g.week === wk; })
      .sort(function(a,b){ return new Date(a.kickoff) - new Date(b.kickoff); });
  }
  function pickFor(week, eventId, player){
    for (var i=0;i<state.picks.length;i++){
      var p = state.picks[i];
      if (p.week===week && p.eventId===eventId && p.player===player) return p;
    }
    return null;
  }
  function allWeeksWithGames(){
    var s = {};
    state.games.forEach(function(g){ s[g.week]=true; });
    return Object.keys(s).map(Number).sort(function(a,b){return a-b;});
  }

  function playerRecord(player){
    var correct=0, incorrect=0, pending=0;
    state.games.forEach(function(g){
      if (g.state !== 'final' || !g.winnerAbbr) return;
      var p = pickFor(g.week, g.eventId, player);
      if (!p) return;
      if (p.teamAbbr === g.winnerAbbr) correct++; else incorrect++;
    });
    return {correct:correct, incorrect:incorrect};
  }

  function weeklyBreakdown(){
    var weeks = allWeeksWithGames();
    return weeks.map(function(wk){
      var row = {week:wk, a:0, b:0, finals:0};
      state.games.filter(function(g){return g.week===wk;}).forEach(function(g){
        if (g.state!=='final' || !g.winnerAbbr) return;
        row.finals++;
        var pa = pickFor(wk, g.eventId, state.config.playerA);
        var pb = pickFor(wk, g.eventId, state.config.playerB);
        if (pa && pa.teamAbbr===g.winnerAbbr) row.a++;
        if (pb && pb.teamAbbr===g.winnerAbbr) row.b++;
      });
      return row;
    }).filter(function(r){ return r.finals>0; });
  }

  // ---------- rendering ----------
  function render(){
    if (state.setupNeeded){
      root.innerHTML = renderSetup();
      bindSetup();
      return;
    }
    if (!state.player){
      root.innerHTML = renderLogin();
      bindLogin();
      return;
    }
    var html = '';
    html += renderHeader();
    html += '<main>';
    if (state.tab === 'week') html += renderWeekTab();
    else html += renderSeasonTab();
    html += '</main>';
    html += '<footer class="note">M&amp;B Pick&#39;em &middot; straight-up picks, no confidence points</footer>';
    if (state.settingsOpen) html += renderSettings();
    if (state.editingGame) html += renderEditGame();
    root.innerHTML = html;
    bindMain();
  }

  function scheduleRender(){
    if ((state.settingsOpen || state.editingGame) && !state.login) { state.pendingRender = true; return; }
    render();
  }

  function initials(name){ return (name||'?').trim().slice(0,1).toUpperCase(); }

  function renderSetup(){
    return (

  function renderGame(g, myName, otherName){
    var locked = isLocked(g);
    var myPick = pickFor(g.week, g.eventId, myName);
    var otherPick = pickFor(g.week, g.eventId, otherName);
    var isFinal = g.state==='final';
    var isLive = g.state==='in';

    var statusTxt;
    if (isFinal) statusTxt = 'Final';
    else if (isLive) statusTxt = 'Q'+(g.quarter||'')+' &middot; '+(g.clock||'Live');
    else statusTxt = fmtTime(g.kickoff);

    function teamBtn(abbr, isHome){
      var name = g[isHome?'homeName':'awayName'] || TEAM_NAMES[abbr] || abbr;
      var score = g[isHome?'homeScore':'awayScore'];
      var mine = myPick && myPick.teamAbbr === abbr;
      var otherHas = locked && otherPick && otherPick.teamAbbr === abbr;
      var cls = 'teambtn';
      if (mine) cls += ' mine';
      if (isFinal && g.winnerAbbr === abbr) cls += ' winner';
      if (isFinal && g.winnerAbbr && g.winnerAbbr !== abbr) cls += ' loser';
      var disabled = locked ? 'disabled' : '';
      var scoreHtml = (isLive || isFinal) ? '<span class="sc tabular">'+(score==null?0:score)+'</span>' : '';
      return '<button class="'+cls+'" '+disabled+' data-pick-team="'+esc(abbr)+'" data-pick-week="'+g.week+'" data-pick-event="'+esc(g.eventId)+'">'+
        '<span class="ab">'+esc(abbr)+'</span><span class="nm">'+esc(name)+'</span>'+scoreHtml+
        (otherHas ? '<span style="font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-top:2px;">'+esc(otherName)+'&#39;s pick</span>' : '')+
      '</button>';
    }

    var picksRow = '<div class="picksrow">';
    [ [myName, myPick], [otherName, locked ? otherPick : null] ].forEach(function(pair){
      var nm = pair[0], pk = pair[1];
      var txt;
      if (!locked && nm===otherName){
        txt = pk ? '<span class="pickpill">'+esc(nm)+': <b>picked</b></span>' : '<span class="pickpill">'+esc(nm)+': <b>no pick yet</b></span>';
      } else if (pk){
        var correctCls = isFinal && g.winnerAbbr ? (pk.teamAbbr===g.winnerAbbr ? 'correct' : 'wrong') : '';
        txt = '<span class="pickpill">'+esc(nm)+': <b class="'+correctCls+'">'+esc(pk.teamAbbr)+'</b></span>';
      } else {
        txt = '<span class="pickpill">'+esc(nm)+': <b>no pick</b></span>';
      }
      picksRow += txt;
    });
    picksRow += '</div>';

    return (
      '<div class="game">'+
        '<div class="gametop"><span class="status '+(isLive?'live':isFinal?'final':'')+'">'+statusTxt+'</span><span class="gtitle">'+esc(g.title||'')+'</span><button class="editscore" data-edit-game="'+esc(g.id)+'" title="Edit score" aria-label="Edit score">&#9998;</button></div>'+
        '<div class="teams">'+
          teamBtn(g.awayAbbr, false)+
          '<div class="vs"><span class="at">@</span>'+(isLive?'<span class="clk">LIVE</span>':'')+'</div>'+
          teamBtn(g.homeAbbr, true)+
        '</div>'+
        picksRow+
      '</div>'
    );
  }

  function saveEditGame(gameId){
    if (!state.db) return;
    var g = state.games.find(function(x){ return x.id === gameId; });
    if (!g) return;
    var newState = document.getElementById('egStatus').value;
    var awayScore = parseInt(document.getElementById('egAway').value, 10) || 0;
    var homeScore = parseInt(document.getElementById('egHome').value, 10) || 0;
    var patch = { state: newState, awayScore: awayScore, homeScore: homeScore };
    if (newState === 'final'){
      patch.winnerAbbr = awayScore === homeScore ? null : (awayScore > homeScore ? g.awayAbbr : g.homeAbbr);
    } else {
      patch.winnerAbbr = null;
    }
    state.db.doc('games/'+gameId).update(patch).catch(function(){
      state.db.doc('games/'+gameId).set(Object.assign({}, g, patch)).catch(function(){});
    });
    // optimistic local update
    state.games = state.games.map(function(x){ return x.id===gameId ? Object.assign({}, x, patch) : x; });
    state.editingGame = null;
    render();
  }

  function submitPick(week, eventId, teamAbbr){
    if (!state.db) return;
    var docId = 'w'+week+'-'+eventId+'-'+state.player;
    state.db.collection('picks').doc(docId).set({
      week: week, eventId: eventId, player: state.player, teamAbbr: teamAbbr, ts: new Date().toISOString()
    }).catch(function(){});
    // optimistic local update
    var found = false;
    state.picks = state.picks.map(function(p){
      if (p.week===week && p.eventId===eventId && p.player===state.player){ found=true; return Object.assign({},p,{teamAbbr:teamAbbr}); }
      return p;
    });
    if (!found) state.picks.push({week:week, eventId:eventId, player:state.player, teamAbbr:teamAbbr});
    render();
  }

  // ---------- ESPN live score sync ----------
  var ESPN_ABBR = {JAX:'JAC', LAR:'LA', WSH:'WAS'};
  function normAbbr(a){ return ESPN_ABBR[a] || a; }

  // NFL weeks run Tue->Mon; Week 1 started Tue Sep 8 2026 00:00 ET (04:00 UTC).
  // Deriving the week from each game's own kickoff date (rather than trusting
  // ESPN's self-reported "current week" number) keeps labels accurate even
  // when ESPN's own week grouping drifts from the real schedule.
  var SEASON_WEEK1_START_UTC = Date.UTC(2026,8,8,4,0,0);
  function computeWeekFromDate(iso){
    var d = new Date(iso).getTime();
    var diffDays = Math.floor((d - SEASON_WEEK1_START_UTC) / 86400000);
    var wk = 1 + Math.floor(diffDays/7);
    return wk < 1 ? 1 : wk;
  }

  function espnEventToDoc(ev, weekNum){
    var comp = ev.competitions && ev.competitions[0];
    if (!comp) return null;
    var home, away;
    comp.competitors.forEach(function(c){
      var side = { abbr: normAbbr(c.team.abbreviation), name: c.team.name || c.team.shortDisplayName, score: parseInt(c.score,10)||0 };
      if (c.homeAway === 'home') home = side; else away = side;
    });
    if (!home || !away) return null;
    var st = ev.status && ev.status.type || {};
    var state_ = st.state === 'in' ? 'in' : (st.completed ? 'final' : 'scheduled');
    var doc = {
      week: weekNum, eventId: ev.id, kickoff: ev.date,
      awayAbbr: away.abbr, awayName: away.name, homeAbbr: home.abbr, homeName: home.name,
      state: state_, awayScore: away.score, homeScore: home.score
    };
    if (state_ === 'in'){ doc.quarter = ev.status.period; doc.clock = ev.status.displayClock; }
    if (state_ === 'final') doc.winnerAbbr = away.score === home.score ? null : (away.score > home.score ? away.abbr : home.abbr);
    if (/Thursday Night|Sunday Night|Monday Night/.test(ev.name||'')) doc.title = (ev.name.match(/\w+ Night Football/)||[])[0];
    return doc;
  }

  function fetchWeek(weekParam){
    var url = 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?year=2026&seasontype=2' + (weekParam ? ('&week='+weekParam) : '');
    return fetch(url).then(function(r){ return r.json(); });
  }

  function syncScoresNow(){
    if (!state.db || state.syncing) return Promise.resolve();
    state.syncing = true; scheduleRender();
    // Determine "now"'s week from the actual calendar date, not from ESPN's
    // self-reported current-week pointer (that pointer has been observed to
    // drift ahead of the real schedule mid-week). Explicit &week=N requests
    // to ESPN return that week's real games reliably.
    var wk = computeWeekFromDate(new Date().toISOString());
    return fetchWeek(wk).then(function(json){
      if (!json.events) throw new Error('bad-response');
      var batch = state.db.batch();
      (json.events||[]).forEach(function(ev){
        var evWeek = computeWeekFromDate(ev.date);
        var d = espnEventToDoc(ev, evWeek);
        if (d) batch.set(state.db.collection('games').doc('w'+evWeek+'-'+ev.id), d, {merge:true});
      });
      var p1 = batch.commit();
      var p2 = fetchWeek(wk+1).then(function(json2){
        var batch2 = state.db.batch();
        (json2.events||[]).forEach(function(ev){
          var evWeek = computeWeekFromDate(ev.date);
          var d = espnEventToDoc(ev, evWeek);
          if (d) batch2.set(state.db.collection('games').doc('w'+evWeek+'-'+ev.id), d, {merge:true});
        });
        return batch2.commit();
      }).catch(function(){});
      return Promise.all([p1, p2]).then(function(){
        if (wk && state.config.currentWeek !== wk){
          return state.db.doc('config/app').update({currentWeek: wk}).catch(function(){});
        }
      });
    }).then(function(){
      state.lastSynced = new Date().toISOString();
      state.syncError = null;
    }).catch(function(err){
      state.syncError = 'Could not reach ESPN right now.';
    }).then(function(){
      state.syncing = false;
      scheduleRender();
    });
  }

  // ---------- boot ----------
  function boot(){
    render();
    if (typeof firebase === 'undefined' || !firebase.apps || !window.FIREBASE_CONFIG || !window.FIREBASE_CONFIG.apiKey){
      state.setupNeeded = true; render();
      return;
    }
    if (!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
    var db = firebase.firestore();
    state.db = db;

    db.doc('config/app').onSnapshot(function(snap){
      if (snap.exists){
        var d = snap.data();
        state.config = Object.assign({}, state.config, d);
      } else if (!state.configLoaded) {
        db.doc('config/app').set(state.config).catch(function(){});
      }
      state.configLoaded = true;
      if (state.selectedWeek == null) state.selectedWeek = computeWeekFromDate(new Date().toISOString());
      scheduleRender();
    }, function(){});

    db.collection('games').onSnapshot(function(qs){
      state.games = qs.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      if (state.selectedWeek == null){
        state.selectedWeek = computeWeekFromDate(new Date().toISOString());
      }
      scheduleRender();
    }, function(){});

    db.collection('picks').onSnapshot(function(qs){
      state.picks = qs.docs.map(function(d){ return d.data(); });
      scheduleRender();
    }, function(){});

    syncScoresNow();
    setInterval(syncScoresNow, 90000);
    document.addEventListener('visibilitychange', function(){ if (!document.hidden) syncScoresNow(); });
  }

  boot();
})();
</script>
</body>
</html>
